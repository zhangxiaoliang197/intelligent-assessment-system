# ============================================================
# 智能评估系统 - Docker Compose 配置
# ------------------------------------------------------------
# 生产环境部署前请通过 .env 文件或环境变量覆盖以下关键配置：
#   MYSQL_HOST     — 元数据库地址（无默认值，必须配置；远程填 IP，本地开发通过 .env 配置）
#   MYSQL_PORT     — 元数据库端口（默认 3306）
#   MYSQL_DATABASE — 元数据库名（默认 assessment）
#   MYSQL_USER     — 元数据库用户名（默认 root）
#   MYSQL_PASSWORD — 元数据库密码（无默认值，必须通过 .env 或环境变量配置）
#   DB_TYPE        — 元数据库类型（默认 mysql，可选 h2/postgresql）
#   INTERNAL_SERVICE_TOKEN — 后端服务间凭据（至少 24 位，不得使用历史开发默认值）
#   ADMIN_API_TOKEN        — 独立管理面凭据（至少 24 位，仅前端 nginx 与 admin 持有）
#   ADMIN_UI_PASSWORD      — 管理页面 Basic Auth 强密码（至少 16 位；生产入口必须启用 TLS）
#
# drivers 命名卷说明：
#   首次启动时 Docker 会把镜像内 /app/drivers 的驱动（MySQL/PostgreSQL/
#   SQL Server）自动复制到命名卷，之后通过 Web 界面上传的 Oracle/达梦等
#   驱动也会持久化到该卷，容器重启不丢失。
# ============================================================

services:
  # ─── Qdrant 向量数据库 ───
  qdrant:
    image: qdrant/qdrant:latest
    container_name: assessment-qdrant
    ports:
      - "6333:6333"
    restart: always
    networks:
      - assessment-net
    volumes:
      - qdrant-data:/qdrant/storage

  frontend:
    image: assessment-frontend:latest
    container_name: assessment-frontend
    ports:
      - "10086:80"
    restart: always
    environment:
      # nginx entrypoint 的 envsubst 仅处理 /etc/nginx/templates/*.template。
      # ADMIN_API_TOKEN 不会写入浏览器包，只在同一容器内注入到管理 API 反向代理请求。
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be configured}
      - ADMIN_UI_PASSWORD=${ADMIN_UI_PASSWORD:?ADMIN_UI_PASSWORD must be configured}
    networks:
      - assessment-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  knowledge-service:
    image: assessment-knowledge:latest
    container_name: assessment-knowledge
    ports:
      - "10252:10252"
    restart: always
    networks:
      - assessment-net
    environment:
      - QDRANT_URL=http://assessment-qdrant:6333
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
    volumes:
      - knowledge-data:/app/data
      - ./logs/knowledge-service:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  qa-service:
    image: assessment-qa:latest
    container_name: assessment-qa
    ports:
      - "10253:10253"
    restart: always
    networks:
      - assessment-net
    environment:
      - ADMIN_SERVICE_URL=http://assessment-admin:10258
      - KNOWLEDGE_SERVICE_URL=http://assessment-knowledge:10252
      - ONTOLOGY_SERVICE_URL=http://assessment-ontology:10256
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}
      - EVALUATION_SKILLS_DIR=/app/config/skills
      - EVALUATION_SKILL_MD_OVERRIDE_DIR=/app/data/skill-markdown-overrides
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
      - LOG_ROTATION_MODE=size
    volumes:
      - qa-data:/app/data
      - ./logs/qa-service:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  indicator-service:
    image: assessment-indicator:latest
    container_name: assessment-indicator
    ports:
      - "10254:10254"
    restart: always
    networks:
      - assessment-net
    environment:
      - QA_SERVICE_URL=http://assessment-qa:10253
      - ADMIN_SERVICE_URL=http://assessment-admin:10258
      - KNOWLEDGE_SERVICE_URL=http://assessment-knowledge:10252
      - EVALUATION_API_URL=http://assessment-qa:10253
      - ONTOLOGY_SERVICE_URL=http://assessment-ontology:10256
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
    volumes:
      - indicator-data:/app/data
      - ./logs/indicator-service:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  evaluation-service:
    image: assessment-evaluation:latest
    container_name: assessment-evaluation
    ports:
      - "10255:10255"
    restart: always
    networks:
      - assessment-net
    environment:
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
    volumes:
      - evaluation-data:/app/data
      - ./logs/evaluation-service:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  ontology-service:
    image: assessment-ontology:latest
    container_name: assessment-ontology
    ports:
      - "10256:10256"
    restart: always
    networks:
      - assessment-net
    environment:
      - ADMIN_SERVICE_URL=http://assessment-admin:10258
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
    volumes:
      - ontology-data:/app/data
      - ./logs/ontology-service:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  situation-service:
    image: assessment-situation:latest
    container_name: assessment-situation
    ports:
      - "127.0.0.1:10257:10257"
    restart: always
    networks:
      - assessment-net
    # 独立于本体/向量库：不配置 ONTOLOGY_SERVICE_URL / QDRANT_URL（ADR-01/05）
    environment:
      - ADMIN_SERVICE_URL=http://assessment-admin:10258
      - SITUATION_ALLOW_DATA_FALLBACK=true
      - SITUATION_DATA_ROW_LIMIT=200
      - SITUATION_STREAM_REPLAY_TTL=300
      - SITUATION_MAX_INFLIGHT=${SITUATION_MAX_INFLIGHT:-8}
      - SITUATION_MAX_CONCURRENT=${SITUATION_MAX_CONCURRENT:-2}
      - SITUATION_MAX_PER_USER=${SITUATION_MAX_PER_USER:-2}
      - SITUATION_GENERATION_TIMEOUT=${SITUATION_GENERATION_TIMEOUT:-240}
      - SITUATION_LLM_EVIDENCE_ROWS=${SITUATION_LLM_EVIDENCE_ROWS:-0}
      - SITUATION_CORS_ORIGINS=${SITUATION_CORS_ORIGINS:-http://localhost:10086,http://127.0.0.1:10086}
      - SITUATION_LLM_ALLOWED_HOSTS=${SITUATION_LLM_ALLOWED_HOSTS:-api.deepseek.com,localhost,127.0.0.1,::1}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}
      - SITUATION_SKILL_DB=/app/data/situation_skills.sqlite3
      - SITUATION_SKILL_MD_OVERRIDE_DIR=/app/data/situation-skill-markdown-overrides
      - LLM_MAX_TOKENS=24000
      - LOG_ENV=${LOG_ENV:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-14}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-100}
    volumes:
      - situation-data:/app/data
      - ./logs/situation-service:/app/logs
    depends_on:
      - admin-service
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:10257/situation/health',timeout=3)); h=d.get('data',{}); assert d.get('success') and h.get('skills',0)>=30 and h.get('skillStorage')=='healthy'"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  admin-service:
    image: assessment-admin:latest
    container_name: assessment-admin
    ports:
      - "127.0.0.1:10258:10258"
    restart: always
    networks:
      - assessment-net
    # ─── 元数据库连接配置（与 start-docker-run.sh / deploy-centos7.sh 对齐）───
    # MYSQL_HOST 无默认值：必须通过 .env 或环境变量显式配置。
    #   - 远程数据库：填 IP 地址（如 192.168.1.100）
    #   - 宿主机数据库：填 host.docker.internal（需配合下方 extra_hosts）
    #   - 本地开发：.env 文件中配置 MYSQL_HOST=localhost
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-assessment}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - SPRING_PROFILES_ACTIVE=${LOG_ENV:-prod}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be configured}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?ADMIN_API_TOKEN must be configured}
      - LOG_PATH=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Linux 下让 host.docker.internal 解析到宿主机网关
    # （仅在 MYSQL_HOST=host.docker.internal 时需要，远程数据库可忽略）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ─── JDBC 驱动持久化 ───
    # 命名卷首次挂载会自动从镜像内 /app/drivers 复制现有驱动；
    # 之后通过管理后台上传的 Oracle/达梦等驱动也会持久化到此卷。
    volumes:
      - drivers-data:/app/drivers
      - ./logs/admin-service:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:10258/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  assessment-net:
    driver: bridge

volumes:
  qdrant-data:
  knowledge-data:
  qa-data:
  indicator-data:
  evaluation-data:
  ontology-data:
  situation-data:
  drivers-data:
