services:
  neo4j:
    image: neo4j:5-community
    container_name: aegis-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/aegis2026!}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - ./data/neo4j-init:/var/lib/neo4j/import
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: aegis-opensearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aegis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./src/backend
      dockerfile: Aegis.API/Dockerfile
    container_name: aegis-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Neo4j: ${NEO4J_URI:-bolt://neo4j:7687}
      Neo4j__User: ${NEO4J_USER:-neo4j}
      Neo4j__Password: ${NEO4J_PASSWORD:-aegis2026!}
      ConnectionStrings__OpenSearch: ${OPENSEARCH_URL:-http://opensearch:9200}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:-redis:6379}
      DeepSeek__ApiKey: ${DEEPSEEK_API_KEY:-}
      DeepSeek__BaseUrl: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DeepSeek__Model: ${DEEPSEEK_MODEL:-deepseek-chat}
    volumes:
      - ./data/neo4j-init:/app/seed-data
    depends_on:
      neo4j:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aegis-network
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - aegis-network
    restart: unless-stopped

volumes:
  neo4j-data:
  opensearch-data:
  redis-data:

networks:
  aegis-network:
    driver: bridge
