server:
  port: ${SERVER_PORT:10258}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: admin-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
          charSet: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ─── 数据库类型配置（docker/环境变量覆盖）───
# DB_TYPE=h2   → H2 内存数据库
# DB_TYPE=mysql   → MySQL 8.x
# DB_TYPE=postgresql → PostgreSQL 16+
db:
  type: ${DB_TYPE:mysql}
  mysql:
    host: ${MYSQL_HOST:localhost}
    port: ${MYSQL_PORT:3306}
    database: ${MYSQL_DATABASE:assessment}
    user: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  postgresql:
    host: ${PG_HOST:localhost}
    port: ${PG_PORT:5432}
    database: ${PG_DATABASE:assessment}
    user: ${PG_USER:postgres}
    password: ${PG_PASSWORD:}

# ─── 驱动文件存储路径 ───
driver:
  storage-path: ${user.dir}/drivers

# ─── 日志配置 ───
# LOG_PATH 由环境变量注入（Docker 内 /app/logs，本地 ./logs）
logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    root: ${LOG_LEVEL:INFO}
    # 抑制框架噪音
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: WARN

internal:
  # Required for backend-to-backend calls. Minimum 24 chars; the historical
  # local-development-token value is deliberately rejected.
  service-token: ${INTERNAL_SERVICE_TOKEN:}

# ─── 下游服务回调：注解变更后失效其进程内缓存 ───
# 留空表示本地开发无 ipage（跳过回调，不产生告警）；Docker 由 -e IPAGE_SERVICE_URL 注入容器名。
ipage:
  service-url: ${IPAGE_SERVICE_URL:}
  invalidate-timeout-ms: ${IPAGE_INVALIDATE_TIMEOUT_MS:5000}

# 语义注解草稿（LLM 生成 + 人工审核）：默认关闭，联调通过后再开启
annotation:
  draft:
    enabled: ${ANNOTATION_DRAFT_ENABLED:false}
    # 单次生成最多覆盖的字段数（超出按批切分）
    max-columns: ${ANNOTATION_DRAFT_MAX_COLUMNS:40}
    # 最多调用模型的批次数（防止字段极多时 token 失控）
    max-batches: ${ANNOTATION_DRAFT_MAX_BATCHES:3}
    # 采样：最多采样列数与单列取值个数（值域校验的基准）
    sample-columns: ${ANNOTATION_DRAFT_SAMPLE_COLUMNS:20}
    sample-values: ${ANNOTATION_DRAFT_SAMPLE_VALUES:30}
    # few-shot：同库已生效注解样例的数据集条数
    fewshot-datasets: ${ANNOTATION_DRAFT_FEWSHOT:3}
    temperature: ${ANNOTATION_DRAFT_TEMPERATURE:0.1}
    max-tokens: ${ANNOTATION_DRAFT_MAX_TOKENS:6000}
    timeout-ms: ${ANNOTATION_DRAFT_TIMEOUT_MS:90000}

admin:
  # Required in X-Admin-Token for every management API. Keep this separate from
  # INTERNAL_SERVICE_TOKEN so a runtime service cannot mutate administration state.
  api-token: ${ADMIN_API_TOKEN:}
  # Emergency diagnostic capability only; disabled by default even for administrators.
  allow-ad-hoc-sql: ${ADMIN_ALLOW_AD_HOC_SQL:false}

# ─── 查询结果行数上限 ───
# 单次 SQL 执行/整表拉取的最大返回行数（含截断保护），clamp 到 [1, 50000]。
# 与态势服务全量取数对齐，避免超大结果集打爆内存/网络。
assessment:
  max-result-rows: ${ADMIN_MAX_RESULT_ROWS:10000}
